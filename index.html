<title>The AI Builder's Handbook: Study Companion</title>
<style>
  :root{
    --ink:#161f2e;
    --ink-2:#1e2a3d;
    --paper:#f3efe3;
    --paper-dim:#c9c2ad;
    --amber:#e8a33d;
    --amber-dim:#a97a2f;
    --amber-solid:#e8a33d;
    --slate:#7c8aa0;

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:var(--sans);

  .wrap{

    margin:0 auto;
    padding:32px 20px 80px;
    display:flex;
    gap:32px;
    align-items:flex-start;

  .sidebar{
    width:220px;
    flex-shrink:0;
    position:sticky;
    top:32px;
    overflow:hidden;
    transition:width .2s ease, opacity .2s ease, margin .2s ease;
  }
  .wrap.collapsed .sidebar{
    width:0;
    opacity:0;
    pointer-events:none;
  }
  .wrap.collapsed{ gap:0; }
  .sidebar-label{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--slate);
    margin-bottom:12px;
    white-space:nowrap;
  }
  .sidebar-collapse-btn{
    background:transparent;
    border:1px solid rgba(240,237,228,0.2);
    color:var(--slate);
    font-size:11px;
    padding:3px 7px;
    border-radius:5px;
    cursor:pointer;
    line-height:1;
  }
  .sidebar-collapse-btn:hover{ border-color:var(--amber); color:var(--amber); }
  .sidebar-expand-btn{
    display:none;
    background:var(--ink-2);
    border:1px solid rgba(240,237,228,0.15);
    color:var(--paper-dim);
    font-family:var(--sans);
    font-size:12px;
    padding:7px 12px;
    border-radius:7px;
    cursor:pointer;
    margin-bottom:16px;
    align-items:center;
    gap:6px;
  }
  .sidebar-expand-btn:hover{ border-color:var(--amber); color:var(--amber); }
  .wrap.collapsed .sidebar-expand-btn{ display:inline-flex; }
  .part-label{
    font-size:10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--amber-dim);
    font-weight:700;
    margin:18px 0 6px 14px;
    white-space:nowrap;
  }
  .part-label:first-child{ margin-top:0; }
  .chapter-tab{
    display:block;
    width:100%;
    text-align:left;
    background:transparent;
    border:none;
    border-left:2px solid rgba(240,237,228,0.12);
    color:var(--paper-dim);
    font-family:var(--sans);
    font-size:13.5px;
    line-height:1.4;
    padding:10px 14px;
    cursor:pointer;
    margin-bottom:2px;
    white-space:nowrap;
  }
  .chapter-tab .num{
    display:block;
    font-size:10.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--slate);
    margin-bottom:2px;
  }
  .chapter-tab.active{
    border-left:2px solid var(--amber);
    color:var(--paper);
    background:rgba(232,163,61,0.06);
  }
  .chapter-tab.active .num{ color:var(--amber); }
  .chapter-tab:hover:not(.active){
    background:rgba(240,237,228,0.04);
    color:var(--paper);
  }
  .main-col{
    flex:1;
    min-width:0;
  }
  @media (max-width:760px){
    .wrap{ flex-direction:column; }
    .wrap.collapsed{ gap:32px; }
    .sidebar{ width:100%; position:static; }
    .wrap.collapsed .sidebar{ width:100%; opacity:1; pointer-events:auto; display:none; }
    .sidebar-expand-btn{ margin-bottom:16px; }
    .chapter-tab{ display:inline-block; width:auto; border-left:none; border-bottom:2px solid rgba(240,237,228,0.12); margin-right:6px; }
    .chapter-tab.active{ border-left:none; border-bottom:2px solid var(--amber); }
    .part-label{ width:100%; margin:14px 0 6px 4px; }

  header.top{

    justify-content:space-between;
    align-items:baseline;
    border-bottom:1px solid rgba(240,237,228,0.15);
    padding-bottom:14px;
    margin-bottom:28px;
  }
  header.top .kicker{
    font-family:var(--sans);
    letter-spacing:0.14em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--amber);
  }

    font-size:21px;
    margin:4px 0 0;
    font-weight:700;
    color:var(--paper);
  }
  .mode-toggle{
    display:flex;

  }

    background:transparent;
    border:1px solid rgba(240,237,228,0.25);

    font-family:var(--sans);
    font-size:12px;
    padding:7px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:all .15s;
  }
  .mode-toggle button.active{
    background:var(--amber);
    border-color:var(--amber);
    color:var(--ink);
    font-weight:600;
  }

  /* ===== SLIDES ===== */
  #slides{display:block;}
  #quiz{display:none;}
  #glossary{display:none;}

  .glossary-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    padding-bottom:16px;
    margin-bottom:20px;
    border-bottom:1px solid rgba(240,237,228,0.12);
  }
  .glossary-search{
    flex:1;
    max-width:340px;
    background:rgba(20,28,42,0.6);
    border:1px solid rgba(240,237,228,0.2);
    color:var(--paper);
    font-family:var(--sans);
    font-size:14px;
    padding:9px 14px;
    border-radius:7px;
  }
  .glossary-search::placeholder{ color:var(--slate); }
  .glossary-search:focus{ outline:none; border-color:var(--amber); }
  .glossary-count{
    font-size:12px;
    color:var(--slate);
    white-space:nowrap;
  }
  .gterm{
    background:var(--ink-2);
    border:1px solid rgba(240,237,228,0.08);
    border-radius:10px;
    padding:18px 22px;
    margin-bottom:10px;
  }
  .gterm .gname{
    font-size:16px;
    font-weight:700;
    color:var(--paper);
    margin-bottom:6px;
  }
  .gterm .gdef{
    font-size:14.5px;
    line-height:1.65;
    color:#dcd8c9;
  }
  .glossary-empty{
    text-align:center;
    padding:40px 20px;
    color:var(--slate);
    font-size:14px;
  }

  .concept-thread{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
    font-size:11px;
    color:var(--slate);
    margin-bottom:22px;
    padding-bottom:14px;
    border-bottom:1px dashed rgba(240,237,228,0.12);
  }
  .concept-thread .node{
    padding:3px 9px;
    border-radius:4px;
    border:1px solid rgba(124,138,160,0.4);
    white-space:nowrap;
  }
  .concept-thread .node.done{ color:var(--amber); border-color:var(--amber-dim); }
  .concept-thread .arrow{ color:var(--slate); }

  .slide{
    background:var(--ink-2);
    border:1px solid rgba(240,237,228,0.08);
    border-radius:10px;
    padding:38px 42px;
    min-height:420px;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .slide .eyebrow{
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--amber);
    margin-bottom:10px;
  }
  .slide h2{
    font-size:27px;
    margin:0 0 18px;
    line-height:1.3;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .slide p{
    font-size:16px;
    line-height:1.7;
    color:#dcd8c9;
    margin:0 0 14px;
  }
  .slide .callout{
    background:rgba(232,163,61,0.08);
    border-left:3px solid var(--amber);
    padding:12px 16px;
    border-radius:4px;
    font-size:14.5px;
    color:var(--paper);
    margin-top:10px;
  }
  .slide .example{
    background:rgba(20,28,42,0.6);
    border:1px solid rgba(240,237,228,0.1);
    border-radius:6px;
    padding:14px 18px;
    font-family:var(--sans);
    font-size:14px;
    color:var(--paper-dim);
    margin-top:12px;
    line-height:1.7;
  }
  .slide .diagram{
    margin-top:14px;
    background:rgba(20,28,42,0.4);
    border:1px solid rgba(240,237,228,0.08);
    border-radius:8px;
    padding:16px;
  }
  .slide svg text{ font-family:var(--sans); }
  .slide .dcap{
    font-size:12px;
    color:var(--slate);
    text-align:center;
    margin-top:8px;
  }
  /* Standalone SVG diagram colors, hardcoded so they render outside any special runtime */
  .dteal rect{ fill:rgba(95,174,122,0.16); stroke:#5fae7a; }
  .dteal text{ fill:#cfe8d9; }
  .damber rect{ fill:rgba(232,163,61,0.22); stroke:#e8a33d; }
  .damber text{ fill:#f6dcae; }
  .dgray rect{ fill:rgba(124,138,160,0.14); stroke:#7c8aa0; }
  .dgray text{ fill:#c6cdd9; }
  .dsvg-label{ fill:#dcd8c9; }
  .dsvg-sub{ fill:#9aa4b5; font-size:12px; }
  .slide svg .t{ font-size:14px; }
  .slide svg .th{ font-size:14px; font-weight:700; }
  .slide svg .ts{ font-size:12px; }
  .slide svg .arr{ stroke:#7c8aa0; stroke-width:1.2; fill:none; }
  .slide svg text:not(.dteal text):not(.damber text):not(.dgray text){ fill:#dcd8c9; }
  .grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-top:14px;
  }
  .card{
    background:rgba(20,28,42,0.5);
    border:1px solid rgba(240,237,228,0.1);
    border-radius:8px;
    padding:16px 18px;
  }
  .card h3{
    font-size:14.5px;
    margin:0 0 6px;
    color:var(--amber);
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.02em;
  }
  .card p{ font-size:13.5px; margin:0; }
  ul.plain{ padding-left:20px; margin:10px 0; }
  ul.plain li{ font-size:15px; line-height:1.7; color:#dcd8c9; margin-bottom:6px; }

  .nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:22px;
  }
  .nav button{
    background:var(--ink-2);
    border:1px solid rgba(240,237,228,0.2);
    color:var(--paper);
    font-family:var(--sans);
    padding:10px 20px;
    border-radius:7px;
    cursor:pointer;
    font-size:14px;
  }
  .nav button:disabled{ opacity:0.3; cursor:default; }
  .nav button:not(:disabled):hover{ border-color:var(--amber); color:var(--amber); }
  .dots{ display:flex; gap:6px; }
  .dot{
    width:7px; height:7px; border-radius:50%;
    background:rgba(240,237,228,0.2);
    transition:all .2s;
  }
  .dot.active{ background:var(--amber); width:20px; border-radius:4px; }

  /* ===== QUIZ ===== */
  .quiz-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:16px;
    margin-bottom:20px;
    border-bottom:1px solid rgba(240,237,228,0.12);
  }
  .quiz-head-title{
    font-size:15px;
    font-weight:700;
    color:var(--paper);
  }
  .reset-btn{
    background:transparent;
    border:1px solid rgba(240,237,228,0.25);
    color:var(--paper-dim);
    font-family:var(--sans);
    font-size:12.5px;
    padding:7px 14px;
    border-radius:7px;
    cursor:pointer;
  }
  .reset-btn:hover{ border-color:var(--amber); color:var(--amber); }
  .qcard{
    background:var(--ink-2);
    border:1px solid rgba(240,237,228,0.08);
    border-radius:10px;
    padding:26px 30px;
    margin-bottom:16px;
  }
  .qcard .qnum{
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--amber);
    margin-bottom:8px;
  }
  .qcard h3{
    font-weight:600;
    font-size:17px;
    margin:0 0 16px;
    line-height:1.5;
  }
  .opt{
    display:block;
    width:100%;
    text-align:left;
    background:rgba(20,28,42,0.5);
    border:1px solid rgba(240,237,228,0.15);
    color:var(--paper);
    padding:12px 16px;
    border-radius:7px;
    margin-bottom:8px;
    cursor:pointer;
    font-size:14.5px;
    font-family:var(--sans);
    transition:all .12s;
  }
  .opt:hover{ border-color:var(--amber); }
  .opt.correct{ border-color:var(--good); background:rgba(95,174,122,0.12); }
  .opt.incorrect{ border-color:var(--bad); background:rgba(209,109,109,0.12); }
  .opt:disabled{ cursor:default; }
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 16px;
    background:rgba(232,163,61,0.06);
    border-left:3px solid var(--amber);
    border-radius:4px;
    font-size:13.5px;
    line-height:1.6;
    color:var(--paper-dim);
  }
  .score-bar{
    text-align:center;
    padding:20px;
    font-family:var(--serif);
    font-size:17px;
    color:var(--amber);
  }
</style>
</head>

  body:`
    <p>The word "agent" can mean a simple script that loops through tool calls,

    <div class="callout">The book's approach: wherever a term is defined

  body:`
    <p>Every other concept in this chapter extends from that one fact.
    <b>Generative AI</b> is the umbrella term for systems that produce new
    content (text, images, audio, code) rather than classifying existing
    content.</p>
    <div class="grid2">
      <div class="card"><h3>Foundation Model</h3><p>Trained on broad data at scale, built to adapt to many tasks. Term coined by Stanford in 2021. GPT, Claude, Gemini, and Llama are all foundation models.</p></div>
      <div class="card"><h3>Large Language Model</h3><p>A foundation model specialized for language. Today's frontier LLMs run hundreds of billions of parameters, some near a trillion.</p></div>
    </div>
    <div class="callout">An LLM does not "know" facts the way a database

  `
},
{
  eyebrow:"1.1 The Raw Material",
  title:"Tokens and the context window define what a model can see at once",
  body:`
    <p>A <b>token</b> is the unit of text a model reads and writes, usually a
    word, part of a word, or a character. The word "evaluation" might be one
    token in one model and three in another. You pay by the token.</p>
    <p>The <b>context window</b> is the total number of tokens a model can
    consider in one request: your prompt, conversation history, retrieved
    documents, and the response being generated.</p>
    <div class="example">In 2026, frontier context windows range from
    around 200,000 tokens (Claude Sonnet 4.6 standard) up to 1,000,000
    tokens (Claude Opus 4.7 extended, Gemini 2.5 Pro).</div>
    <div class="callout">A bigger window does not mean every token is used
    well. Attention quality often degrades toward the middle and edges of
    long contexts, known as the "lost in the middle" problem.</div>

    <p><b>Reasoning models</b> are a newer class trained specifically to
    reason longer before answering. OpenAI's o-series and GPT-5's reasoning

const glossary = [
  { term:"Generative AI", chapter:1, def:"The umbrella term for AI systems that produce new content, text, images, audio, code, or video, rather than classifying existing content. LLMs are the most familiar shape it takes." },
  { term:"Foundation Model", chapter:1, def:"A model trained on broad data at scale, designed to be adapted to many downstream tasks rather than built for one. GPT, Claude, Gemini, and Llama are all foundation models." },
  { term:"Large Language Model (LLM)", chapter:1, def:"A foundation model specialized for language. It reads text and produces text, and does not know facts the way a database does, it produces text that fits the patterns of its training data." },
  { term:"Tokens", chapter:1, def:"The unit of text a model reads and writes, usually a word, part of a word, or a character. You pay by the token, and you have a limited number that fit in a single request." },
  { term:"Context Window", chapter:1, def:"The total number of tokens a model can consider in a single request: your prompt, conversation history, retrieved documents, and the response it is generating." },
  { term:"Lost in the Middle", chapter:1, def:"The production concern that attention quality often degrades toward the middle and edges of very long contexts, even when the content fits well within the context window." },
  { term:"Pretraining", chapter:1, def:"The expensive, general step where a model trains on trillions of tokens of web, book, and code data. This is where the model learns the shape of language." },
  { term:"Fine-Tuning", chapter:1, def:"Adapting a pretrained model to a narrower task using a much smaller labeled dataset, such as a general LLM fine-tuned on legal documents for contract review." },
  { term:"Post-Training", chapter:1, def:"The umbrella for everything between raw pretraining and a deployable model: instruction tuning, RLHF, safety tuning, and reasoning training. Mostly responsible for what makes a frontier model good." },
  { term:"Chain-of-Thought", chapter:1, def:"Asking a model to think step by step before producing a final answer. Shown by a 2022 Google Brain paper to dramatically improve accuracy on math, logic, and multi-step problems." },
  { term:"Reasoning Models", chapter:1, def:"A newer class of models trained specifically to reason longer and more carefully before answering, trading speed and cost for reliability on hard problems." },
  { term:"Multimodality", chapter:1, def:"Models that accept more than text as input or output, such as images, charts, and screenshots, removing the need for a separate OCR pipeline for most document work." },
  { term:"Prompting", chapter:1, def:"The practice of crafting the input to a model so it produces the output you want. Part craft, part design, part empirical testing." },
  { term:"System Prompt", chapter:1, def:"A special kind of prompt that sits above the user's message and sets the model's role, rules, and scope for the whole conversation." },
  { term:"Few-Shot Learning", chapter:1, def:"Giving the model examples of the input-output pattern you want directly inside the prompt. Three good examples often outperform a carefully tuned zero-shot prompt." },
  { term:"Context Engineering", chapter:1, def:"The broader discipline of deciding what goes into the context window and in what order: system prompts, examples, retrieved documents, tool definitions, history, and output format." },
  { term:"Tool Use", chapter:1, def:"Giving a model the ability to invoke external functions like search, database queries, or custom APIs. The model decides when a tool is needed and reads the result." },
  { term:"Agent", chapter:1, def:"A system where a model uses tools in a loop to accomplish a goal, deciding what to do at each step based on what it observes. Not every LLM-powered system is an agent." },
  { term:"Workflow vs Agent", chapter:1, def:"A workflow embeds an LLM in a predefined path where the developer decides the steps. An agent decides the steps dynamically. Most production systems today are workflows." },
  { term:"Router Pattern", chapter:1, def:"One LLM call decides which downstream specialist or path handles a request, then dispatches it. Cheap, fast, and one of the most effective ways to lift quality in production." },
  { term:"Specialist / Sub-Agent", chapter:1, def:"A downstream component that handles a narrower task than the orchestrator above it, with its own prompt, tools, and evaluation criteria." },
  { term:"Multi-Agent System", chapter:1, def:"A system where multiple agents coordinate to solve a larger problem, communicating through messages or shared state. Powerful but hard to get right." },
  { term:"Retrieval", chapter:1, def:"The general capability of looking something up and including it in the model's context before answering. Can pull from a document store, database, search engine, or knowledge graph." },
  { term:"Semantic Search", chapter:1, def:"Converting text into vectors (embeddings) that capture meaning, then finding other text whose vectors are close in that space, instead of matching keywords." },
  { term:"Vector Database", chapter:1, def:"Infrastructure built to store and search embeddings at scale. Choice of vector database matters less than your retrieval strategy and your evals." },
  { term:"Memory", chapter:1, def:"Persisted state across turns or sessions. Short-term memory is the current conversation. Long-term memory is what the system chooses to remember across sessions." },
  { term:"Evaluation (Evals)", chapter:1, def:"The practice of measuring how well your system performs on specific tasks, at scale, with a repeatable method. The single muscle worth building most if you ship AI systems." },
  { term:"LLM-as-Judge", chapter:1, def:"Using one language model to score another language model's output against a rubric. Never trust a judge you have not calibrated against human labels first." },
  { term:"Hallucination", chapter:1, def:"When a model produces confident text that is not grounded in reality. Not a bug you can fix with a better prompt, a consequence of how LLMs work. Reduced, never eliminated." },
  { term:"Grounding", chapter:1, def:"Tying a model's output to a verified source, usually a retrieved document. A grounded answer can be traced back to its source. The most effective defense against hallucination." },
  { term:"Guardrails", chapter:1, def:"Safety checks that run before (input) or after (output) the model. Input guardrails filter PII and prompt injection. Output guardrails filter tone, leaks, and hallucination." },
  { term:"Observability and Tracing", chapter:1, def:"Watching what your system is actually doing in production: every prompt, tool call, and response captured as a structured trace you can filter and analyze." },
  { term:"Model Context Protocol (MCP)", chapter:1, def:"An open protocol, published by Anthropic in late 2024, for connecting language models to external tools and data sources in a standardized way. Fast becoming the USB-C of AI integrations." },
  { term:"Agents SDK", chapter:1, def:"OpenAI's 2025 framework for building agent applications, packaged as openai-agents, handling the agent loop, tool calls, and handoffs. LangGraph and CrewAI occupy similar space." },
  { term:"Pilots vs Production Gap", chapter:2, def:"The gap where teams that succeeded in AI pilots did not always succeed in production, because production requires eval harnesses, guardrails, observability, and retraining loops, work a pilot does not." },
  { term:"Augment First, Automate Later", chapter:2, def:"The pattern behind systems that stayed shipped: the human stays in the loop and approves while the system drafts, and only the most trusted steps get automated over time." },
  { term:"Narrow Scope, Deep Quality", chapter:2, def:"Picking a narrow, well-defined problem and building one great system for it, rather than an AI assistant for everything. Narrow scope makes evaluation tractable." },
  { term:"Workflows Before Agents", chapter:2, def:"The production guidance that the router-and-specialist workflow pattern is the most common, structured, debuggable, and evaluable production shape, tried before reaching for free-roaming agents." },
  { term:"Start Capable, Downsize, Escalate", chapter:3, def:"The chapter's three-step model selection rule: prototype with the strongest model you can afford, swap in cheaper models where quality holds, and escalate to a reasoning model only when evals plateau below the bar." },
  { term:"Model Dimensions", chapter:3, def:"The multi-dimensional tradeoff behind model selection: capability, latency, cost, context length, modality, reasoning, and licensing. No single dimension decides the choice alone." },
  { term:"Reasoning vs Standard Model", chapter:3, def:"A reasoning model is trained specifically to reason through problems, make plans, and check its own work, making it strong on multi-step tasks and unnecessary overhead on simple ones like classification or summarization." },
  { term:"Open vs Closed Models", chapter:3, def:"Open models (Llama, Qwen, DeepSeek) offer control, cost predictability at scale, and no lock-in. Closed models (Claude, GPT, Gemini) offer the most capable frontier reasoning and zero self-hosting overhead. Most production systems mix both." },
  { term:"Problem-First Design", chapter:4, def:"The framework used to ground every AI project before any prompt gets written. Thirty minutes of clean problem definition upfront saves months of unclear iteration later." },
  { term:"The Four Layers Framework", chapter:4, def:"A four-layer structure for any AI design conversation, written in order: the user and their pain, the outcome, the AI intervention, and the system and safety scaffolding around it." },
  { term:"Layer 1: The User and Their Pain", chapter:4, def:"Who is the user, and what are they doing today that you want to change? Requires a named role, an actual task, and measurable pain, not a vague group like \"employees.\"" },
  { term:"Layer 2: The Outcome", chapter:4, def:"What changes when your system works, and how do you know? Written before the system itself, so the goal is defined before the build begins." },
  { term:"Layer 3: The AI Intervention", chapter:4, def:"The narrowest useful definition of what the AI system actually does: the specific pattern and capability. Often bloated in failed projects. Narrow it until it hurts." },
  { term:"Layer 4: The System and Safety", chapter:4, def:"What the system needs around it to be trustworthy: evals, guardrails, observability, human oversight, rollback, and audit trail. The production scaffolding." },
  { term:"Tech-First Thinking", chapter:4, def:"A design trap where AI is the given and the problem is the search, starting from \"we want to use AI for X\" instead of a specific user pain point." },
  { term:"Over-Scoping", chapter:4, def:"A design trap where three problems are packed into one system because they feel related. The resulting system does none of them well and is impossible to evaluate." },
  { term:"Solutioning in the Problem Statement", chapter:4, def:"A design trap where the problem statement describes an architecture instead of a pain point, leaving out who hurts, where, and how much." },
  { term:"Human Baseline", chapter:4, def:"A measurement of how long a task takes a human today and how often they get it wrong, taken before building an AI system. Without it, you cannot tell if the AI system is actually an improvement." },
  { term:"Scoping Template", chapter:4, def:"A six-question template filled in collaboratively before design starts: who the user is, their current pain, the desired outcome, the core AI capability, what \"ready to ship\" means, and what can go wrong." },
{ term:"Context Engineering", chapter:5, def:"The discipline of deciding what goes into a model's context window, in what order, with what structure. Prompting is one piece of it, not the whole discipline." },
  { term:"The Six Parts of a Working Prompt", chapter:5, def:"Role, context, task, constraints, examples, and output format. A prompt that consistently works has all six, even when some are implicit." },
  { term:"Prompting Reasoning Models", chapter:5, def:"Three rules that change when prompting a reasoning model: less hand-holding, more context and less structure, and separating the what from the how. You are briefing a specialist, not scripting a task." },
  { term:"Few-Shot Examples", chapter:5, def:"Two or three input-output pairs included in a prompt. Consistently outperforms almost any other single intervention on subjective or structured tasks." },
  { term:"Output Format Choices", chapter:5, def:"Structured JSON for machine consumers, markdown for human readers, and tagged sections for mixed narrative and structured output. Match the format to the next consumer." },
  { term:"Prompt Engineering Ceiling", chapter:5, def:"The point where additional prompt iteration stops producing gains and starts producing noise. The fix is usually better retrieval, a model upgrade, a workflow restructure, or fine-tuning, not more prompt edits." }
];

let activeChapter = 0;
let idx = 0;

function renderChapterRow(){
  const row = document.getElementById('chapterRow');
  let html = '';
  let lastPart = null;
  chapters.forEach((c,i)=>{
    if(c.part && c.part !== lastPart){
      html += `<div class="part-label">${c.part}</div>`;
      lastPart = c.part;
    }
    html += `<button class="chapter-tab ${i===activeChapter?'active':''}" onclick="switchChapter(${i})">
      <span class="num">Chapter ${c.id}</span>${c.title}
    </button>`;
  });
  row.innerHTML = html;
}

function switchChapter(i){
  activeChapter = i;
  idx = 0;
  document.getElementById('chapterTitle').innerText = chapters[i].title;
  renderChapterRow();
  renderSlide();
  renderQuiz();
  showMode('slides');
  document.getElementById('btnSlides').classList.add('active');
  document.getElementById('btnQuiz').classList.remove('active');
}

/* ---------------- SLIDE RENDERING ---------------- */
function renderThread(){
  const t = document.getElementById('thread');
  const nodes = chapters[activeChapter].threadNodes;
  t.innerHTML = nodes.map((n,i)=>{
    const doneClass = i <= currentThreadStage() ? 'done' : '';
    return `<span class="node ${doneClass}">${n}</span>` + (i<nodes.length-1 ? `<span class="arrow">→</span>` : '');
  }).join('');
}
function currentThreadStage(){
  const slides = chapters[activeChapter].slides;
  const stageCount = chapters[activeChapter].threadNodes.length;
  return Math.min(stageCount - 1, Math.floor((idx / slides.length) * stageCount));
}

function renderSlide(){
  const slides = chapters[activeChapter].slides;
  const s = slides[idx];
  document.getElementById('slideHost').innerHTML = `
    <div class="slide">
      <div class="eyebrow">${s.eyebrow}</div>
      <h2>${s.title}</h2>
      ${s.body}
    </div>
  `;
  document.getElementById('prevBtn').disabled = idx===0;
  document.getElementById('nextBtn').disabled = idx===slides.length-1;
  document.getElementById('nextBtn').innerText = idx===slides.length-1 ? 'Done' : 'Next →';
  renderDots();
  renderThread();
  window.scrollTo({top:0, behavior:'smooth'});
}
function renderDots(){
  const slides = chapters[activeChapter].slides;
  document.getElementById('dots').innerHTML = slides.map((_,i)=>
    `<div class="dot ${i===idx?'active':''}"></div>`
  ).join('');
}
function go(dir){
  const slides = chapters[activeChapter].slides;
  const next = idx + dir;
  if(next>=0 && next<slides.length){ idx = next; renderSlide(); }
}

/* ---------------- GLOSSARY ---------------- */
function renderGlossary(filterText){
  const host = document.getElementById('glossary');
  const q = (filterText || '').trim().toLowerCase();
  const sorted = [...glossary].sort((a,b)=>a.term.localeCompare(b.term));
  const filtered = q ? sorted.filter(g =>
    g.term.toLowerCase().includes(q) || g.def.toLowerCase().includes(q)
  ) : sorted;

  let html = `<div class="glossary-head">
    <input type="text" class="glossary-search" id="glossarySearch" placeholder="Search all terms..." value="${(filterText||'').replace(/"/g,'&quot;')}" oninput="renderGlossary(this.value)">
    <div class="glossary-count">${filtered.length} of ${glossary.length} terms</div>
  </div>`;

  if(filtered.length === 0){
    html += `<div class="glossary-empty">No terms match "${q}". Try a different search.</div>`;
  } else {
    filtered.forEach(g => {
      html += `<div class="gterm">
        <div class="gname">${g.term}</div>
        <div class="gdef">${g.def}</div>
      </div>`;
    });
  }
  host.innerHTML = html;

  const input = document.getElementById('glossarySearch');
  if(input && filterText !== undefined){
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  }
}

  const host = document.getElementById('quiz');
  let html = `<div class="quiz-head">
    <div class="quiz-head-title">${chapters[activeChapter].title}</div>
    <button class="reset-btn" onclick="resetQuiz()">Retake quiz</button>
  </div>`;
  quizData.forEach((item, i)=>{
    const tag = item.type==='scenario' ? ' · Applied' : (item.type==='multi' ? ' · Select all that apply' : '');
    html += `<div class="qcard" id="q${i}">
      <div class="qnum">Question ${i+1} of ${quizData.length}${tag}</div>
      <h3>${item.q}</h3>`;
    if(item.type==='multi'){
      item.options.forEach((opt, oi)=>{
        html += `<label class="opt" id="opt${i}_${oi}" style="display:flex;align-items:center;gap:10px;cursor:pointer;">
          <input type="checkbox" id="chk${i}_${oi}" style="width:16px;height:16px;flex-shrink:0;">
          <span>${opt}</span>
        </label>`;
      });
      html += `<button onclick="submitMulti(${i})" style="margin-top:8px;background:var(--amber);border:none;color:var(--ink);font-weight:700;padding:9px 18px;border-radius:7px;cursor:pointer;font-size:13.5px;" id="submitBtn${i}">Check answer</button>`;
      html += `<div class="explain" id="exp${i}">${item.explain}</div>`;
    } else {
      item.options.forEach((opt, oi)=>{
        html += `<button class="opt" id="opt${i}_${oi}" onclick="answer(${i},${oi})">${opt}</button>`;
      });
      html += `<div class="explain" id="exp${i}">${item.explain}</div>`;
    }
    html += `</div>`;
  });
  host.innerHTML = html;
}

function resetQuiz(){
  renderQuiz();
  window.scrollTo({top:0, behavior:'smooth'});
}

function answer(qi, oi){
  const quizData = chapters[activeChapter].quiz;
  const item = quizData[qi];
  for(let o=0;o<item.options.length;o++){
    const btn = document.getElementById(`opt${qi}_${o}`);
    btn.disabled = true;
    if(o===item.correct) btn.classList.add('correct');
    else if(o===oi) btn.classList.add('incorrect');
  }
  document.getElementById(`exp${qi}`).style.display = 'block';
}

function submitMulti(qi){
  const quizData = chapters[activeChapter].quiz;
  const item = quizData[qi];
  const correctSet = new Set(item.correctSet);
  item.options.forEach((opt, oi)=>{
    const chk = document.getElementById(`chk${qi}_${oi}`);
    const label = document.getElementById(`opt${qi}_${oi}`);
    chk.disabled = true;
    const picked = chk.checked;
    const shouldBeChecked = correctSet.has(oi);
    if(shouldBeChecked && picked) label.classList.add('correct');
    else if(shouldBeChecked && !picked) label.classList.add('correct');
    else if(!shouldBeChecked && picked) label.classList.add('incorrect');
  });
  document.getElementById(`submitBtn${qi}`).disabled = true;
  document.getElementById(`submitBtn${qi}`).style.opacity = '0.4';
  document.getElementById(`exp${qi}`).style.display = 'block';
}

/* ---------------- INIT ---------------- */
renderChapterRow();
renderSlide();
renderQuiz();
</script>
</body>
</html>
