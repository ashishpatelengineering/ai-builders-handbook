<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The AI Builder's Handbook: Study Companion</title>
<style>
  :root{
    --ink:#161f2e;
    --ink-2:#1e2a3d;
    --paper:#f3efe3;
    --paper-dim:#c9c2ad;
    --amber:#e8a33d;
    --amber-dim:#a97a2f;
    --amber-solid:#e8a33d;
    --slate:#7c8aa0;
    --good:#5fae7a;
    --bad:#d16d6d;
    --serif: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    /* One font family throughout. Hierarchy comes from size and weight, not typeface switching. */
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:var(--sans);
    min-height:100vh;
  }
  .wrap{
    max-width:1160px;
    margin:0 auto;
    padding:32px 20px 80px;
    display:flex;
    gap:32px;
    align-items:flex-start;
  }
  .sidebar{
    width:220px;
    flex-shrink:0;
    position:sticky;
    top:32px;
    overflow:hidden;
    transition:width .2s ease, opacity .2s ease, margin .2s ease;
  }
  .wrap.collapsed .sidebar{
    width:0;
    opacity:0;
    pointer-events:none;
  }
  .wrap.collapsed{ gap:0; }
  .sidebar-label{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--slate);
    margin-bottom:12px;
    white-space:nowrap;
  }
  .sidebar-collapse-btn{
    background:transparent;
    border:1px solid rgba(240,237,228,0.2);
    color:var(--slate);
    font-size:11px;
    padding:3px 7px;
    border-radius:5px;
    cursor:pointer;
    line-height:1;
  }
  .sidebar-collapse-btn:hover{ border-color:var(--amber); color:var(--amber); }
  .sidebar-expand-btn{
    display:none;
    background:var(--ink-2);
    border:1px solid rgba(240,237,228,0.15);
    color:var(--paper-dim);
    font-family:var(--sans);
    font-size:12px;
    padding:7px 12px;
    border-radius:7px;
    cursor:pointer;
    margin-bottom:16px;
    align-items:center;
    gap:6px;
  }
  .sidebar-expand-btn:hover{ border-color:var(--amber); color:var(--amber); }
  .wrap.collapsed .sidebar-expand-btn{ display:inline-flex; }
  .part-label{
    font-size:10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--amber-dim);
    font-weight:700;
    margin:18px 0 6px 14px;
    white-space:nowrap;
  }
  .part-label:first-child{ margin-top:0; }
  .chapter-tab{
    display:block;
    width:100%;
    text-align:left;
    background:transparent;
    border:none;
    border-left:2px solid rgba(240,237,228,0.12);
    color:var(--paper-dim);
    font-family:var(--sans);
    font-size:13.5px;
    line-height:1.4;
    padding:10px 14px;
    cursor:pointer;
    margin-bottom:2px;
    white-space:nowrap;
  }
  .chapter-tab .num{
    display:block;
    font-size:10.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--slate);
    margin-bottom:2px;
  }
  .chapter-tab.active{
    border-left:2px solid var(--amber);
    color:var(--paper);
    background:rgba(232,163,61,0.06);
  }
  .chapter-tab.active .num{ color:var(--amber); }
  .chapter-tab:hover:not(.active){
    background:rgba(240,237,228,0.04);
    color:var(--paper);
  }
  .main-col{
    flex:1;
    min-width:0;
  }
  @media (max-width:760px){
    .wrap{ flex-direction:column; }
    .wrap.collapsed{ gap:32px; }
    .sidebar{ width:100%; position:static; }
    .wrap.collapsed .sidebar{ width:100%; opacity:1; pointer-events:auto; display:none; }
    .sidebar-expand-btn{ margin-bottom:16px; }
    .chapter-tab{ display:inline-block; width:auto; border-left:none; border-bottom:2px solid rgba(240,237,228,0.12); margin-right:6px; }
    .chapter-tab.active{ border-left:none; border-bottom:2px solid var(--amber); }
    .part-label{ width:100%; margin:14px 0 6px 4px; }
  }
  header.top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:1px solid rgba(240,237,228,0.15);
    padding-bottom:14px;
    margin-bottom:28px;
  }
  header.top .kicker{
    font-family:var(--sans);
    letter-spacing:0.14em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--amber);
  }
  header.top h1{
    font-size:21px;
    margin:4px 0 0;
    font-weight:700;
    color:var(--paper);
  }
  .mode-toggle{
    display:flex;
    gap:8px;
  }
  .mode-toggle button{
    background:transparent;
    border:1px solid rgba(240,237,228,0.25);
    color:var(--paper-dim);
    font-family:var(--sans);
    font-size:12px;
    padding:7px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:all .15s;
  }
  .mode-toggle button.active{
    background:var(--amber);
    border-color:var(--amber);
    color:var(--ink);
    font-weight:600;
  }

  /* ===== SLIDES ===== */
  #slides{display:block;}
  #quiz{display:none;}
  #glossary{display:none;}

  .glossary-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    padding-bottom:16px;
    margin-bottom:20px;
    border-bottom:1px solid rgba(240,237,228,0.12);
  }
  .glossary-search{
    flex:1;
    max-width:340px;
    background:rgba(20,28,42,0.6);
    border:1px solid rgba(240,237,228,0.2);
    color:var(--paper);
    font-family:var(--sans);
    font-size:14px;
    padding:9px 14px;
    border-radius:7px;
  }
  .glossary-search::placeholder{ color:var(--slate); }
  .glossary-search:focus{ outline:none; border-color:var(--amber); }
  .glossary-count{
    font-size:12px;
    color:var(--slate);
    white-space:nowrap;
  }
  .gterm{
    background:var(--ink-2);
    border:1px solid rgba(240,237,228,0.08);
    border-radius:10px;
    padding:18px 22px;
    margin-bottom:10px;
  }
  .gterm .gname{
    font-size:16px;
    font-weight:700;
    color:var(--paper);
    margin-bottom:6px;
  }
  .gterm .gdef{
    font-size:14.5px;
    line-height:1.65;
    color:#dcd8c9;
  }
  .glossary-empty{
    text-align:center;
    padding:40px 20px;
    color:var(--slate);
    font-size:14px;
  }

  .concept-thread{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
    font-size:11px;
    color:var(--slate);
    margin-bottom:22px;
    padding-bottom:14px;
    border-bottom:1px dashed rgba(240,237,228,0.12);
  }
  .concept-thread .node{
    padding:3px 9px;
    border-radius:4px;
    border:1px solid rgba(124,138,160,0.4);
    white-space:nowrap;
  }
  .concept-thread .node.done{ color:var(--amber); border-color:var(--amber-dim); }
  .concept-thread .arrow{ color:var(--slate); }

  .slide{
    background:var(--ink-2);
    border:1px solid rgba(240,237,228,0.08);
    border-radius:10px;
    padding:38px 42px;
    min-height:420px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    position:relative;
  }
  .focus-toggle-btn{
    position:absolute;
    top:16px;
    right:16px;
    width:32px;
    height:32px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(20,28,42,0.5);
    border:1px solid rgba(240,237,228,0.15);
    border-radius:7px;
    color:var(--slate);
    cursor:pointer;
    transition:background .15s, color .15s;
    z-index:5;
  }
  .focus-toggle-btn:hover{
    background:rgba(20,28,42,0.9);
    color:var(--paper);
    border-color:rgba(240,237,228,0.3);
  }
  .focus-toggle-btn svg{ width:16px; height:16px; }

  /* ===== FOCUS MODE ===== */
  #wrap.focus-mode .sidebar,
  #wrap.focus-mode .sidebar-expand-btn,
  #wrap.focus-mode header.top,
  #wrap.focus-mode .concept-thread{
    display:none !important;
  }
  #wrap.focus-mode .main-col{
    max-width:1120px;
    margin:0 auto;
    padding-top:40px;
  }
  #wrap.focus-mode .slide{
    min-height:65vh;
    padding:64px 76px;
  }
  #wrap.focus-mode .slide .eyebrow{
    font-size:13px;
  }
  #wrap.focus-mode .slide h2{
    font-size:38px;
    margin-bottom:24px;
  }
  #wrap.focus-mode .slide p,
  #wrap.focus-mode .slide li{
    font-size:18px;
    line-height:1.7;
  }
  #wrap.focus-mode .slide .card h3{
    font-size:15px;
  }
  #wrap.focus-mode .slide .card p{
    font-size:16px;
  }
  #wrap.focus-mode .slide .callout,
  #wrap.focus-mode .slide .example{
    font-size:17px;
    padding:22px 26px;
  }
  #wrap.focus-mode .nav{
    display:none;
  }
  .focus-position{
    display:none;
    text-align:center;
    margin-top:24px;
    font-size:13px;
    letter-spacing:0.08em;
    color:var(--slate);
    text-transform:uppercase;
  }
  #wrap.focus-mode .focus-position{
    display:block;
  }
  @media (max-width: 1200px){
    #wrap.focus-mode .main-col{ max-width:94vw; }
  }
  @media (max-width: 720px){
    #wrap.focus-mode .slide{ padding:32px 24px; min-height:50vh; }
    #wrap.focus-mode .slide h2{ font-size:26px; }
    #wrap.focus-mode .slide p,
    #wrap.focus-mode .slide li{ font-size:16px; }
  }
  .slide .eyebrow{
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--amber);
    margin-bottom:10px;
  }
  .slide h2{
    font-size:27px;
    margin:0 0 18px;
    line-height:1.3;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .slide p{
    font-size:16px;
    line-height:1.7;
    color:#dcd8c9;
    margin:0 0 14px;
  }
  .slide .callout{
    background:rgba(232,163,61,0.08);
    border-left:3px solid var(--amber);
    padding:12px 16px;
    border-radius:4px;
    font-size:14.5px;
    color:var(--paper);
    margin-top:10px;
  }
  .slide .example{
    background:rgba(20,28,42,0.6);
    border:1px solid rgba(240,237,228,0.1);
    border-radius:6px;
    padding:14px 18px;
    font-family:var(--sans);
    font-size:14px;
    color:var(--paper-dim);
    margin-top:12px;
    line-height:1.7;
  }
  .slide .diagram{
    margin-top:14px;
    background:rgba(20,28,42,0.4);
    border:1px solid rgba(240,237,228,0.08);
    border-radius:8px;
    padding:16px;
  }
  .slide svg text{ font-family:var(--sans); }
  .slide .dcap{
    font-size:12px;
    color:var(--slate);
    text-align:center;
    margin-top:8px;
  }
  /* Standalone SVG diagram colors, hardcoded so they render outside any special runtime */
  .dteal rect{ fill:rgba(95,174,122,0.16); stroke:#5fae7a; }
  .dteal text{ fill:#cfe8d9; }
  .damber rect{ fill:rgba(232,163,61,0.22); stroke:#e8a33d; }
  .damber text{ fill:#f6dcae; }
  .dgray rect{ fill:rgba(124,138,160,0.14); stroke:#7c8aa0; }
  .dgray text{ fill:#c6cdd9; }
  .dsvg-label{ fill:#dcd8c9; }
  .dsvg-sub{ fill:#9aa4b5; font-size:12px; }
  .slide svg .t{ font-size:14px; }
  .slide svg .th{ font-size:14px; font-weight:700; }
  .slide svg .ts{ font-size:12px; }
  .slide svg .arr{ stroke:#7c8aa0; stroke-width:1.2; fill:none; }
  .slide svg text:not(.dteal text):not(.damber text):not(.dgray text){ fill:#dcd8c9; }
  .grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-top:14px;
  }
  .card{
    background:rgba(20,28,42,0.5);
    border:1px solid rgba(240,237,228,0.1);
    border-radius:8px;
    padding:16px 18px;
  }
  .card h3{
    font-size:14.5px;
    margin:0 0 6px;
    color:var(--amber);
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.02em;
  }
  .card p{ font-size:13.5px; margin:0; }
  ul.plain{ padding-left:20px; margin:10px 0; }
  ul.plain li{ font-size:15px; line-height:1.7; color:#dcd8c9; margin-bottom:6px; }

  .nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:22px;
  }
  .nav button{
    background:var(--ink-2);
    border:1px solid rgba(240,237,228,0.2);
    color:var(--paper);
    font-family:var(--sans);
    padding:10px 20px;
    border-radius:7px;
    cursor:pointer;
    font-size:14px;
  }
  .nav button:disabled{ opacity:0.3; cursor:default; }
  .nav button:not(:disabled):hover{ border-color:var(--amber); color:var(--amber); }
  .dots{ display:flex; gap:6px; }
  .dot{
    width:7px; height:7px; border-radius:50%;
    background:rgba(240,237,228,0.2);
    transition:all .2s;
  }
  .dot.active{ background:var(--amber); width:20px; border-radius:4px; }

  /* ===== QUIZ ===== */
  .quiz-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:16px;
    margin-bottom:20px;
    border-bottom:1px solid rgba(240,237,228,0.12);
  }
  .quiz-head-title{
    font-size:15px;
    font-weight:700;
    color:var(--paper);
  }
  .reset-btn{
    background:transparent;
    border:1px solid rgba(240,237,228,0.25);
    color:var(--paper-dim);
    font-family:var(--sans);
    font-size:12.5px;
    padding:7px 14px;
    border-radius:7px;
    cursor:pointer;
  }
  .reset-btn:hover{ border-color:var(--amber); color:var(--amber); }
  .qcard{
    background:var(--ink-2);
    border:1px solid rgba(240,237,228,0.08);
    border-radius:10px;
    padding:26px 30px;
    margin-bottom:16px;
  }
  .qcard .qnum{
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--amber);
    margin-bottom:8px;
  }
  .qcard h3{
    font-weight:600;
    font-size:17px;
    margin:0 0 16px;
    line-height:1.5;
  }
  .opt{
    display:block;
    width:100%;
    text-align:left;
    background:rgba(20,28,42,0.5);
    border:1px solid rgba(240,237,228,0.15);
    color:var(--paper);
    padding:12px 16px;
    border-radius:7px;
    margin-bottom:8px;
    cursor:pointer;
    font-size:14.5px;
    font-family:var(--sans);
    transition:all .12s;
  }
  .opt:hover{ border-color:var(--amber); }
  .opt.correct{ border-color:var(--good); background:rgba(95,174,122,0.12); }
  .opt.incorrect{ border-color:var(--bad); background:rgba(209,109,109,0.12); }
  .opt:disabled{ cursor:default; }
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 16px;
    background:rgba(232,163,61,0.06);
    border-left:3px solid var(--amber);
    border-radius:4px;
    font-size:13.5px;
    line-height:1.6;
    color:var(--paper-dim);
  }
  .score-bar{
    text-align:center;
    padding:20px;
    font-family:var(--serif);
    font-size:17px;
    color:var(--amber);
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">

  <aside class="sidebar">
    <div class="sidebar-label">
      Chapters
      <button class="sidebar-collapse-btn" onclick="toggleSidebar()" aria-label="Hide chapter list">← Hide</button>
    </div>
    <div id="chapterRow"></div>
  </aside>

  <div class="main-col">

    <button class="sidebar-expand-btn" onclick="toggleSidebar()" aria-label="Show chapter list">☰ Chapters</button>

    <header class="top">
      <div>
        <div class="kicker">The AI Builder's Handbook, study companion</div>
        <h1 id="chapterTitle">The Language of Generative and Agentic AI</h1>
      </div>
      <div class="mode-toggle">
        <button id="btnSlides" class="active" onclick="showMode('slides')">Lesson</button>
        <button id="btnQuiz" onclick="showMode('quiz')">Quiz</button>
        <button id="btnGlossary" onclick="showMode('glossary')">Glossary</button>
      </div>
    </header>

    <!-- ============ SLIDES ============ -->
    <div id="slides">
      <div class="concept-thread" id="thread"></div>
      <div id="slideHost"></div>
      <div class="nav">
        <button id="prevBtn" onclick="go(-1)">← Back</button>
        <div class="dots" id="dots"></div>
        <button id="nextBtn" onclick="go(1)">Next →</button>
      </div>
      <div class="focus-position" id="focusPosition"></div>
    </div>

    <!-- ============ QUIZ ============ -->
    <div id="quiz"></div>

    <!-- ============ GLOSSARY ============ -->
    <div id="glossary"></div>

  </div>
</div>

<script>
/* ============================================================
   TEMPLATE CHAPTER DATA
   Copy this whole block once per chapter, rename ch1 -> ch2, ch3, etc.
   Delete this example content and replace with real chapter content.
   ============================================================ */

const ch1_slides = [
{
  eyebrow:"Chapter 1",
  title:"The Language of Generative and Agentic AI",
  body:`
    <ul class="plain">
      <li>The AI field's vocabulary doubles every six months</li>
      <li>"Agent" might mean a Python script that loops through tool calls, or an autonomous system that plans, acts, and recovers on its own</li>
      <li>"Eval" might mean a unit test, a scorecard, or a full human-labeled benchmark</li>
      <li>This chapter is your ground truth: a shared map of the vocabulary, organized the way builders actually use it</li>
    </ul>
    <div class="callout">Wherever two reputable sources define a term differently, this guide follows the usage closest to how the work actually gets done in production.</div>
  `
},
{
  eyebrow:"The Raw Material",
  title:"The Raw Material",
  body:`
    <ul class="plain">
      <li>The system you are building on top of is a probability machine trained to predict text</li>
      <li>Every other concept in this guide extends from that one fact</li>
    </ul>
  `
},
{
  eyebrow:"The Raw Material",
  title:"Generative AI",
  body:`
    <ul class="plain">
      <li>A class of AI systems that produces new content (text, images, audio, code, video) rather than classifying existing content</li>
      <li>Generative AI is the umbrella</li>
      <li>Large language models are the most familiar shape it takes</li>
      <li>Image models, audio models, and video models live under the same umbrella</li>
    </ul>
  `
},
{
  eyebrow:"The Raw Material",
  title:"Foundation Model",
  body:`
    <ul class="plain">
      <li>A model trained on broad data at scale, designed to be adapted to many downstream tasks rather than built for any one task</li>
      <li>Term coined by the Stanford Center for Research on Foundation Models in 2021</li>
      <li>Today GPT, Claude, Gemini, Llama are all foundation models</li>
      <li>You can use them directly, or adapt them for a specific job through fine-tuning</li>
    </ul>
  `
},
{
  eyebrow:"The Raw Material",
  title:"Large Language Model (LLM)",
  body:`
    <ul class="plain">
      <li>A foundation model specialized for language. It reads text, produces text</li>
      <li>"Large" refers to the parameter count: today's frontier LLMs have hundreds of billions of parameters, some approaching the trillion mark</li>
    </ul>
    <div class="callout">An LLM does not "know" facts the way a database does. It has learned to produce text that fits the patterns of its training data. The behavior that feels magical and the behavior that feels wrong both trace back to that one fact.</div>
  `
},
{
  eyebrow:"The Raw Material",
  title:"Tokens",
  body:`
    <ul class="plain">
      <li>The unit of text a model reads and writes</li>
      <li>A token is usually a word, part of a word, or a character, depending on the tokenizer</li>
      <li>"Evaluation" might be one token in one model and three in another</li>
    </ul>
    <div class="callout">Two practical consequences: you pay by the token, and you have a limited number of tokens you can fit into a single request.</div>
  `
},
{
  eyebrow:"The Raw Material",
  title:"Context Window",
  body:`
    <ul class="plain">
      <li>The total number of tokens a model can consider in a single request: your prompt, the conversation history, any retrieved documents, and the response it is generating</li>
      <li>Frontier models in 2026 range from around 200,000 tokens (Claude Sonnet 4.6 standard) up to 1,000,000 tokens (Claude Opus 4.7 with extended context, Gemini 2.5 Pro)</li>
    </ul>
    <div class="callout">A larger context window does not mean the model will use every token well. Attention quality often degrades toward the middle and edges of very long contexts. This is called the "lost in the middle" problem and is a real production concern.</div>
  `
},
{
  eyebrow:"The Raw Material",
  title:"Pretraining, Fine-Tuning, Post-Training",
  body:`
    <p>Three stages a model passes through on the way to being useful.</p>

const glossary = [
{ term:"Generative AI", chapter:1, def:"AI that creates new content, text, images, audio, video, code, rather than just analyzing or sorting things that already exist. ChatGPT, Midjourney, and Claude are all generative AI." },
  { term:"Foundation Model", chapter:1, def:"A large, general-purpose AI model trained on massive amounts of data, built to be adapted for many different tasks rather than one specific job. GPT, Claude, Gemini, and Llama are all foundation models." },
  { term:"Large Language Model (LLM)", chapter:1, def:"A foundation model trained specifically on language: it reads text and generates text. It works by predicting likely patterns from its training data, not by looking up facts in a database." },
  { term:"Tokens", chapter:1, def:"The small pieces of text a model actually processes, roughly a word or part of a word. Models are priced and limited by how many tokens they read and write." },
  { term:"Context Window", chapter:1, def:"The total amount of text (measured in tokens) a model can \"see\" and consider at once, including your prompt, chat history, and any documents provided. Bigger isn't automatically better; models can lose track of details buried in the middle of a very long context." },
  { term:"Pretraining, Fine-Tuning, Post-Training", chapter:1, def:"The three stages of building a model. Pretraining teaches it language from huge amounts of raw data. Fine-tuning specializes it for a narrower task using a smaller dataset. Post-training (including techniques like RLHF) polishes its behavior, tone, and safety." },
  { term:"Chain-of-Thought", chapter:1, def:"A technique where a model is prompted to reason through a problem step by step before giving its final answer, which often improves accuracy on math, logic, and multi-step questions." },
  { term:"Reasoning Models", chapter:1, def:"A class of models built to think longer and more carefully before responding, trading extra time and cost for better performance on hard, multi-step problems." },
  { term:"Multimodality", chapter:1, def:"A model's ability to work with more than just text, such as understanding images, audio, or video, not only reading and writing words." },
  { term:"Prompting", chapter:1, def:"Writing input to an AI model in a way that reliably gets you the output you want. Part clear communication, part trial and error." },
  { term:"System Prompt", chapter:1, def:"A hidden instruction set placed above the user's messages that defines the model's role, rules, and behavior for an entire conversation." },
  { term:"Few-Shot and In-Context Learning", chapter:1, def:"Teaching a model a pattern by showing it a few examples directly in the prompt, rather than retraining it. The model picks up the pattern on the spot." },
  { term:"Context Engineering", chapter:1, def:"The broader practice of deciding exactly what information, instructions, and tools to put into a model's context, and in what order, to get the best possible result. A wider discipline than writing one clever prompt." },
  { term:"Tool Use and Function Calling", chapter:1, def:"Giving a model access to external functions, like a search engine, a database, or a calculator, so it can fetch information or take actions beyond just generating text." },
  { term:"Agent", chapter:1, def:"An AI system that can use tools repeatedly and decide its own next steps to accomplish a goal, rather than just responding once to a single instruction." },
  { term:"Workflow vs Agent", chapter:1, def:"A workflow follows a fixed, human-designed sequence of steps with the AI filling in the details. An agent decides its own sequence of steps on the fly. Workflows are more predictable; agents are more flexible but harder to control." },
  { term:"Router and Classifier Patterns", chapter:1, def:"A setup where one AI call first figures out what kind of request it's dealing with, then hands it off to the right specialized handler, similar to a receptionist directing calls to the correct department." },
  { term:"Specialist and Sub-Agent", chapter:1, def:"A component focused on one narrow task within a larger system, with its own dedicated prompt and tools, as opposed to a general-purpose model trying to do everything." },
  { term:"Multi-Agent System", chapter:1, def:"A setup where multiple AI agents work together, each handling part of a larger problem and communicating with one another. Powerful, but complex to build and debug well." },
  { term:"Retrieval", chapter:1, def:"Looking up relevant information (from documents, databases, or the web) and feeding it to a model before it answers, so its response is grounded in real, current information rather than only what it remembers from training." },
  { term:"RAG (Retrieval-Augmented Generation)", chapter:1, def:"A common pattern where a model retrieves relevant documents first, then uses them as context to generate its answer. One specific way of doing retrieval, not the only one." },
  { term:"Semantic Search and Embeddings", chapter:1, def:"A way of finding information based on meaning rather than exact keyword matches. Text is converted into embeddings, lists of numbers that represent meaning, and similar meanings end up numerically close together." },
  { term:"Vector Database", chapter:1, def:"A database specialized for storing and quickly searching embeddings, the numeric representations used in semantic search. Pinecone, Weaviate, and pgvector are common examples." },
  { term:"Memory", chapter:1, def:"An AI system's ability to retain information across a conversation (short-term) or across multiple separate sessions over time (long-term), such as remembering a user's preferences." },
  { term:"Evaluation (Evals)", chapter:1, def:"A structured, repeatable way of measuring how well an AI system is actually performing, rather than judging it by impression alone. Considered one of the most important skills in building reliable AI products." },
  { term:"LLM-as-Judge", chapter:1, def:"Using one AI model to automatically score or grade another model's output against a rubric, a way to evaluate quality at a scale humans can't match by hand." },
  { term:"Hallucination", chapter:1, def:"When an AI model confidently states something false or made-up as if it were fact. It's an inherent risk of how these models generate text, not a simple bug to patch." },
  { term:"Grounding", chapter:1, def:"Connecting a model's answer to a real, verifiable source, so the response can be checked and trusted rather than taken on faith. One of the best defenses against hallucination." },
  { term:"Guardrails", chapter:1, def:"Safety checks that filter what goes into a model (like blocking harmful requests) and what comes out of it (like catching false or inappropriate responses), keeping the system safe and reliable in production." },
  { term:"Observability and Tracing", chapter:1, def:"The practice of logging and monitoring exactly what an AI system does in real use, every request, tool call, and response, so problems can be spotted, understood, and fixed." },
  { term:"Model Context Protocol (MCP)", chapter:1, def:"An open, standardized way for AI models to connect to external tools and data sources, so developers don't need custom integration code for every single service." },
  { term:"Agents SDK", chapter:1, def:"A developer toolkit (in this case, OpenAI's) for building AI agents, handling common needs like managing tool calls, multi-step loops, and handoffs between agents." },
  { term:"Parameters", chapter:1, def:"The internal numerical values a model learns during training that determine how it processes input and generates output. Roughly, more parameters means a larger, generally more capable model." },
  { term:"Zero-Shot Prompting", chapter:1, def:"Asking a model to complete a task with no examples at all, just an instruction, relying entirely on what it already learned during training." },
  { term:"Temperature", chapter:1, def:"A setting that controls how random or predictable a model's output is. Low temperature gives safer, more consistent answers; high temperature gives more varied, creative ones." },
  { term:"Fine-Tuned Model", chapter:1, def:"A foundation model that has been further trained on a smaller, specific dataset to specialize it for a particular task or domain, like customer support or legal writing." },
{ term:"Pilot vs Production", chapter:2, def:"A pilot is a small trial run of an AI system to see if the idea works. Production means the system is actually relied on by real users daily. Succeeding at one doesn't guarantee succeeding at the other." },
  { term:"ROI (Return on Investment)", chapter:2, def:"A measure of whether the value or savings a system produces are worth what it cost to build and run." },
  { term:"Augment vs Automate", chapter:2, def:"Augmenting means the AI assists a human, who still makes the final call. Automating means the AI acts on its own, with no human review needed for that step." },
  { term:"Narrow Scope", chapter:2, def:"Deliberately limiting an AI system to one specific, well-defined problem instead of trying to make it handle everything. Easier to build well and easier to evaluate." },
  { term:"Router-and-Specialist Pattern", chapter:2, def:"A common system design where one component figures out what kind of request has come in, then routes it to a smaller, focused component built to handle exactly that type of task." },
  { term:"Eval Harness", chapter:2, def:"The tooling and tests a team uses to regularly check how well their AI system is actually performing, rather than relying on gut feeling." },
  { term:"Quality Drift", chapter:2, def:"When an AI system's real-world performance gradually gets worse over time without anyone noticing, usually because nobody is actively measuring it." },
  { term:"Problem Discovery", chapter:2, def:"The upfront work of clearly identifying who has a problem, what that problem actually is, and whether AI is genuinely the right way to solve it, before any building starts." },
  { term:"Post-Mortem", chapter:2, def:"A review conducted after a project fails or underperforms, aimed at understanding what went wrong so the same mistake isn't repeated." },
  { term:"Over-Scoping", chapter:2, def:"Designing a system to be more complex or ambitious than the actual problem requires, such as building a multi-agent system when a simple workflow would have worked fine." },
{ term:"Benchmark", chapter:3, def:"A standardized test used to measure and compare how well different AI models perform on specific tasks, like MMLU or HumanEval. Useful for a rough sense of quality, but not a substitute for testing on your own use case." },
  { term:"Latency", chapter:3, def:"How long it takes a model to respond after receiving a request. Matters a lot for live chat, barely at all for background jobs nobody is waiting on." },
  { term:"Inference", chapter:3, def:"The process of a trained model actually generating a response to a new input, as opposed to the training process that created the model in the first place." },
  { term:"Open-Source Model vs Closed Model", chapter:3, def:"An open model's weights are publicly available and can be run and modified by anyone. A closed model can only be accessed through the provider's own API, with the underlying weights kept private." },
  { term:"Self-Hosting", chapter:3, def:"Running an AI model on your own servers or infrastructure instead of calling it through a provider's API. Gives more control but adds operational work and cost." },
  { term:"Data Residency", chapter:3, def:"Legal or policy requirements that data must be stored and processed within a specific country or region, often a deciding factor in whether a team can use a cloud-based API or must self-host a model instead." },
  { term:"Vendor Lock-In", chapter:3, def:"Becoming so dependent on one provider's specific tools or APIs that switching to a different provider later becomes difficult or costly." },
{ term:"Problem-First Design", chapter:4, def:"The practice of clearly defining who has a problem and what that problem actually is before writing any code or prompts, rather than starting with a technology and looking for a use for it." },
  { term:"Scoping", chapter:4, def:"The process of clearly defining the boundaries of a project before building it, what it will do, who it's for, and what counts as done." },
  { term:"Human Baseline", chapter:4, def:"A measurement of how a task is currently done by a person, how long it takes and how often mistakes happen, used as the comparison point for judging whether an AI system is actually an improvement." },
  { term:"Pilot", chapter:4, def:"A small, controlled test of a system with a limited group of users, run to see whether an idea works before committing to building it for everyone." },
  { term:"Rollback Plan", chapter:4, def:"A predefined way to quickly undo or disable a system if something goes wrong after launch, restoring the previous working state." },
  { term:"Audit Trail", chapter:4, def:"A record of what a system did and when, kept so that actions can be reviewed, verified, or investigated later if something goes wrong." },
  { term:"Iteration", chapter:4, def:"Repeatedly improving something through cycles of building, testing, and adjusting, rather than trying to get everything right in a single attempt." },
{ term:"Structured Output", chapter:5, def:"AI output formatted in a strict, predictable shape, like valid JSON, that other software can reliably read and process without extra parsing work." },
  { term:"Schema", chapter:5, def:"A defined structure or blueprint describing exactly what fields a piece of data should have and what type each one is, used to check that output matches the expected format." },
  { term:"Zero-Shot Prompt", chapter:5, def:"A prompt that asks a model to complete a task with no examples included, relying entirely on the instructions and what the model already learned during training." },
  { term:"Prompt Iteration", chapter:5, def:"The process of repeatedly testing and adjusting a prompt's wording to improve how well it performs, usually guided by evals rather than guesswork." },
  { term:"Edge Case", chapter:5, def:"An unusual or extreme input that sits at the boundary of what a system was designed to handle, often where things are most likely to go wrong." }
];

let activeChapter = 0;
let idx = 0;

function renderChapterRow(){
  const row = document.getElementById('chapterRow');
  let html = '';
  let lastPart = null;
  chapters.forEach((c,i)=>{
    if(c.part && c.part !== lastPart){
      html += `<div class="part-label">${c.part}</div>`;
      lastPart = c.part;
    }
    html += `<button class="chapter-tab ${i===activeChapter?'active':''}" onclick="switchChapter(${i})">
      <span class="num">Chapter ${c.id}</span>${c.title}
    </button>`;
  });
  row.innerHTML = html;
}

function switchChapter(i){
  activeChapter = i;
  idx = 0;
  document.getElementById('chapterTitle').innerText = chapters[i].title;
  renderChapterRow();
  renderSlide();
  renderQuiz();
  showMode('slides');
  document.getElementById('btnSlides').classList.add('active');
  document.getElementById('btnQuiz').classList.remove('active');
}

/* ---------------- SLIDE RENDERING ---------------- */
function renderThread(){
  const t = document.getElementById('thread');
  const nodes = chapters[activeChapter].threadNodes;
  t.innerHTML = nodes.map((n,i)=>{
    const doneClass = i <= currentThreadStage() ? 'done' : '';
    return `<span class="node ${doneClass}">${n}</span>` + (i<nodes.length-1 ? `<span class="arrow">→</span>` : '');
  }).join('');
}
function currentThreadStage(){
  const slides = chapters[activeChapter].slides;
  const nodes = chapters[activeChapter].threadNodes;
  const currentEyebrow = slides[idx] && slides[idx].eyebrow;
  const exactMatch = nodes.indexOf(currentEyebrow);
  if(exactMatch !== -1) return exactMatch;
  const stageCount = nodes.length;
  return Math.min(stageCount - 1, Math.floor((idx / slides.length) * stageCount));
}

  const slides = chapters[activeChapter].slides;
  const s = slides[idx];
  document.getElementById('slideHost').innerHTML = `
    <div class="slide">
      <button class="focus-toggle-btn" onclick="toggleFocusMode()" aria-label="Toggle focus mode" id="focusToggleBtn">${focusIconSVG(false)}</button>
      <div class="eyebrow">${s.eyebrow}</div>
      <h2>${s.title}</h2>
      ${s.body}
    </div>
  `;
  document.getElementById('prevBtn').disabled = idx===0;
  document.getElementById('nextBtn').disabled = idx===slides.length-1;
  document.getElementById('nextBtn').innerText = idx===slides.length-1 ? 'Done' : 'Next →';
  document.getElementById('focusPosition').innerText = (idx+1) + ' / ' + slides.length;
  renderDots();
  renderThread();
  syncFocusIcon();
  window.scrollTo({top:0, behavior:'smooth'});
}
function renderDots(){
  const slides = chapters[activeChapter].slides;
  document.getElementById('dots').innerHTML = slides.map((_,i)=>
    `<div class="dot ${i===idx?'active':''}"></div>`
  ).join('');
}
function go(dir){
  const slides = chapters[activeChapter].slides;
  const next = idx + dir;
  if(next>=0 && next<slides.length){ idx = next; renderSlide(); }
}

/* ---------------- FOCUS MODE ---------------- */
let focusMode = false;
function focusIconSVG(isFocused){
  return isFocused
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5a2 2 0 0 1 2-2h4M20 9V5a2 2 0 0 0-2-2h-4M4 15v4a2 2 0 0 0 2 2h4M20 15v4a2 2 0 0 1-2 2h-4"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>`;
}
function toggleFocusMode(){
  focusMode = !focusMode;
  document.getElementById('wrap').classList.toggle('focus-mode', focusMode);
  syncFocusIcon();
}
function syncFocusIcon(){
  const btn = document.getElementById('focusToggleBtn');
  if(btn) btn.innerHTML = focusIconSVG(focusMode);
}
document.addEventListener('keydown', function(e){
  if(!focusMode) return;
  const tag = (e.target && e.target.tagName) || '';
  if(tag === 'INPUT' || tag === 'TEXTAREA') return;
  const slidesVisible = document.getElementById('slides').style.display !== 'none';
  if(!slidesVisible) return;
  if(e.key === 'ArrowRight'){ e.preventDefault(); go(1); }
  else if(e.key === 'ArrowLeft'){ e.preventDefault(); go(-1); }
  else if(e.key === 'Escape'){ e.preventDefault(); toggleFocusMode(); }
});

/* ---------------- MODE TOGGLE ---------------- */
function showMode(mode){
  document.getElementById('slides').style.display = mode==='slides' ? 'block' : 'none';
  document.getElementById('quiz').style.display = mode==='quiz' ? 'block' : 'none';
  document.getElementById('glossary').style.display = mode==='glossary' ? 'block' : 'none';
  document.getElementById('btnSlides').classList.toggle('active', mode==='slides');
  document.getElementById('btnQuiz').classList.toggle('active', mode==='quiz');
  document.getElementById('btnGlossary').classList.toggle('active', mode==='glossary');
  if(mode==='glossary') renderGlossary();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------------- GLOSSARY ---------------- */
function renderGlossary(filterText){
  const host = document.getElementById('glossary');
  const q = (filterText || '').trim().toLowerCase();
  const sorted = [...glossary].sort((a,b)=>a.term.localeCompare(b.term));
  const filtered = q ? sorted.filter(g =>
    g.term.toLowerCase().includes(q) || g.def.toLowerCase().includes(q)
  ) : sorted;

  let html = `<div class="glossary-head">
    <input type="text" class="glossary-search" id="glossarySearch" placeholder="Search all terms..." value="${(filterText||'').replace(/"/g,'&quot;')}" oninput="renderGlossary(this.value)">
    <div class="glossary-count">${filtered.length} of ${glossary.length} terms</div>
  </div>`;

  if(filtered.length === 0){
    html += `<div class="glossary-empty">No terms match "${q}". Try a different search.</div>`;
  } else {
    filtered.forEach(g => {
      html += `<div class="gterm">
        <div class="gname">${g.term}</div>
        <div class="gdef">${g.def}</div>
      </div>`;
    });
  }
  host.innerHTML = html;

  const input = document.getElementById('glossarySearch');
  if(input && filterText !== undefined){
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  }
}

function toggleSidebar(){
  document.getElementById('wrap').classList.toggle('collapsed');
}

/* ---------------- QUIZ ---------------- */
function renderQuiz(){
  const quizData = chapters[activeChapter].quiz;
  const host = document.getElementById('quiz');
  let html = `<div class="quiz-head">
    <div class="quiz-head-title">${chapters[activeChapter].title}</div>
    <button class="reset-btn" onclick="resetQuiz()">Retake quiz</button>
  </div>`;
  quizData.forEach((item, i)=>{
    const tag = item.type==='scenario' ? ' · Applied' : (item.type==='multi' ? ' · Select all that apply' : '');
    html += `<div class="qcard" id="q${i}">
      <div class="qnum">Question ${i+1} of ${quizData.length}${tag}</div>
      <h3>${item.q}</h3>`;
    if(item.type==='multi'){
      item.options.forEach((opt, oi)=>{
        html += `<label class="opt" id="opt${i}_${oi}" style="display:flex;align-items:center;gap:10px;cursor:pointer;">
          <input type="checkbox" id="chk${i}_${oi}" style="width:16px;height:16px;flex-shrink:0;">
          <span>${opt}</span>
        </label>`;
      });
      html += `<button onclick="submitMulti(${i})" style="margin-top:8px;background:var(--amber);border:none;color:var(--ink);font-weight:700;padding:9px 18px;border-radius:7px;cursor:pointer;font-size:13.5px;" id="submitBtn${i}">Check answer</button>`;
      html += `<div class="explain" id="exp${i}">${item.explain}</div>`;
    } else {
      item.options.forEach((opt, oi)=>{
        html += `<button class="opt" id="opt${i}_${oi}" onclick="answer(${i},${oi})">${opt}</button>`;
      });
      html += `<div class="explain" id="exp${i}">${item.explain}</div>`;
    }
    html += `</div>`;
  });
  host.innerHTML = html;
}

function resetQuiz(){
  renderQuiz();
  window.scrollTo({top:0, behavior:'smooth'});
}

function answer(qi, oi){
  const quizData = chapters[activeChapter].quiz;
  const item = quizData[qi];
  for(let o=0;o<item.options.length;o++){
    const btn = document.getElementById(`opt${qi}_${o}`);
    btn.disabled = true;
    if(o===item.correct) btn.classList.add('correct');
    else if(o===oi) btn.classList.add('incorrect');
  }
  document.getElementById(`exp${qi}`).style.display = 'block';
}

function submitMulti(qi){
  const quizData = chapters[activeChapter].quiz;
  const item = quizData[qi];
  const correctSet = new Set(item.correctSet);
  item.options.forEach((opt, oi)=>{
    const chk = document.getElementById(`chk${qi}_${oi}`);
    const label = document.getElementById(`opt${qi}_${oi}`);
    chk.disabled = true;
    const picked = chk.checked;
    const shouldBeChecked = correctSet.has(oi);
    if(shouldBeChecked && picked) label.classList.add('correct');
    else if(shouldBeChecked && !picked) label.classList.add('correct');
    else if(!shouldBeChecked && picked) label.classList.add('incorrect');
  });
  document.getElementById(`submitBtn${qi}`).disabled = true;
  document.getElementById(`submitBtn${qi}`).style.opacity = '0.4';
  document.getElementById(`exp${qi}`).style.display = 'block';
}

/* ---------------- INIT ---------------- */
renderChapterRow();
renderSlide();
renderQuiz();
</script>
</body>
</html>
